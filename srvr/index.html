<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>The Dobinator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-reboot.min.css" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css" />

  <link rel="stylesheet" href="assets/css/styles.css" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffffff'/%3E%3C/svg%3E" />
</head>
<body data-running="0" data-status="0">
  <div class="shell">
    <header class="topbar">
      <span class="brand" aria-label="The Dobinator">
        <span class="brand-dot" aria-hidden="true"></span>
        The Dobinator
      </span>
      <div class="topbar-actions">
        <!-- Label printing lives on its own site now (drivelabel.c-nav.com,
             served by IIS from drivelabel/site on this same PC). This is just a
             link there — no modal, no print code in this portal. -->
        <a id="printBtn" class="print-btn" href="http://drivelabel.c-nav.com/"
           target="_blank" rel="noopener" aria-label="Print a drive label" title="Print Label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9V2h12v7"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8" rx="1"/>
          </svg>
        </a>
        <button id="nameDriveBtn" class="name-drive-btn" aria-label="Name pending drives" title="Drives waiting to be named">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
            <line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
          <span id="nameDriveCount" class="pending-count" aria-hidden="true"></span>
        </button>
        <button id="updateBtn" class="update-btn" aria-label="Apply available update" title="Update available">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <path d="M7 10l5 5 5-5"/>
            <path d="M12 15V3"/>
          </svg>
        </button>
        <button id="pendingBtn" class="pending-btn" aria-label="View Pending Drives" title="View Pending Drives">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
          </svg>
          <span id="pendingCount" class="pending-count" aria-hidden="true"></span>
        </button>
        <button id="historyBtn" class="history-btn" aria-label="View Completed Drives" title="View Completed Drives">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </button>
        <button id="powerBtn" class="power-btn" aria-label="Toggle The Dobinator" title="Toggle The Dobinator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v10"/>
            <path d="M5.6 6.4a8 8 0 1 0 12.8 0"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="stage" class="stage" aria-live="polite"></main>

    <!-- History Modal -->
    <div id="historyModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Completed Drives</h2>
          <div class="modal-header-actions">
            <button id="clearCompletedBtn" class="modal-clear-btn" aria-label="Clear completed drives" title="Clear the list (drives stay recorded in the CSV)">Clear</button>
            <button id="closeHistoryBtn" class="modal-close" aria-label="Close modal">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
        <div id="historyList" class="modal-body">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Pending Drives Modal -->
    <div id="pendingModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" id="pendingModalBackdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Pending Drives</h2>
          <button id="closePendingBtn" class="modal-close" aria-label="Close modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="pendingList" class="modal-body">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- New-Drive Prompt Modal (blank drives awaiting name + country) -->
    <div id="drivePromptModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="drivePromptTitle">New Drive</h2>
          <button id="closeDrivePromptBtn" class="modal-close" aria-label="Close (name this drive later)" title="Close — you can reopen this from the tag button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <label class="form-field">
            <span class="form-label">Drive Name</span>
            <input id="driveNameInput" class="form-input" type="text" autocomplete="off"
                   spellcheck="false" placeholder="e.g. BasinElectric" />
          </label>
          <label class="form-field">
            <span class="form-label">Country</span>
            <select id="driveCountrySelect" class="form-input">
              <!-- Populated by JS -->
            </select>
          </label>
        </div>
        <div class="modal-footer modal-footer-center">
          <button id="confirmDriveBtn" class="modal-btn modal-btn-confirm" disabled>Confirm</button>
        </div>
      </div>
    </div>

    <!-- Update-while-processing Modal -->
    <div id="updateModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" id="updateModalBackdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Update Available</h2>
          <button id="closeUpdateBtn" class="modal-close" aria-label="Close modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <p class="subline" style="margin-top:0;">
            Update cannot be applied while drives are processing. Would you like to
            schedule this update for when processing completes?
          </p>
        </div>
        <div class="modal-footer">
          <button id="cancelUpdateBtn" class="modal-btn modal-btn-secondary">Cancel</button>
          <button id="scheduleUpdateBtn" class="modal-btn modal-btn-primary">Schedule</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
