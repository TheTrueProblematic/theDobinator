<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Dobinator — Preview</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-reboot.min.css" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-running="0" data-status="0">
  <div class="shell">
    <header class="topbar">
      <span class="brand" aria-label="The Dobinator">
        <span class="brand-dot" aria-hidden="true"></span>
        The Dobinator
      </span>
      <div class="topbar-actions">
        <button id="updateBtn" class="update-btn" aria-label="Apply available update" title="Update available">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <path d="M7 10l5 5 5-5"/>
            <path d="M12 15V3"/>
          </svg>
        </button>
        <button id="nameDriveBtn" class="name-drive-btn" aria-label="Name pending drives" title="Drives waiting to be named">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
            <line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
          <span id="nameDriveCount" class="pending-count" aria-hidden="true"></span>
        </button>
        <button id="pendingBtn" class="pending-btn" aria-label="View Pending Drives" title="View Pending Drives">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
          </svg>
          <span id="pendingCount" class="pending-count" aria-hidden="true"></span>
        </button>
        <button id="powerBtn" class="power-btn" aria-label="Toggle The Dobinator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v10"/>
            <path d="M5.6 6.4a8 8 0 1 0 12.8 0"/>
          </svg>
        </button>
      </div>
    </header>
    <main id="stage" class="stage" aria-live="polite"></main>

    <!-- Pending Drives Modal (so the preview/test harness can render the list) -->
    <div id="pendingModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" id="pendingModalBackdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Pending Drives</h2>
        </div>
        <div id="pendingList" class="modal-body"></div>
      </div>
    </div>

    <!-- Completed Drives Modal (so the preview/test harness can render the list) -->
    <div id="historyModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Completed Drives</h2>
          <div class="modal-header-actions">
            <button id="clearCompletedBtn" class="modal-clear-btn">Clear</button>
          </div>
        </div>
        <div id="historyList" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { render } from './assets/js/render.js';
    import { normalizeState } from './assets/js/api.js';

    let last = null;
    window.applyState = function (raw) {
      const state = raw && raw._error ? raw : normalizeState(raw);
      render(state, last);
      last = state;
    };

    // Initial paint: off-state
    window.applyState({ Running: 0, StatusNumber: 0 });

    // Allow parent test harness to drive via postMessage too
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'setState') window.applyState(e.data.state);
    });

    // Tell parent we're ready
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'preview-ready' }, '*');
    }
  </script>
</body>
</html>
